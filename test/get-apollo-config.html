<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GetApolloConfig 测试</title>
  <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    h1 { font-size: 22px; margin-bottom: 8px; color: #222; }
    .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
    label { display: block; margin-bottom: 6px; color: #444; font-size: 14px; }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .message.success { display: block; background: #ecfdf5; color: #065f46; }
    .message.error { display: block; background: #fef2f2; color: #991b1b; }
    .panel {
      margin-top: 20px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #334155;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 480px;
      overflow: auto;
    }
    .panel h2 { font-size: 13px; margin-bottom: 8px; font-family: inherit; }
  </style>
</head>
<body>
  <div class="container">
    <h1>GetApolloConfig 测试</h1>
    <p class="subtitle">通过代理头调用远程接口，获取 Apollo application 命名空间配置</p>

    <label for="endpoint">接口地址</label>
    <input id="endpoint" type="text" value="https://gameland.21game.live/v1/auth/gen-token" />

    <button id="fetchBtn" type="button">获取 Apollo 配置</button>

    <div id="message" class="message"></div>

    <div class="panel">
      <h2>本次请求</h2>
      <pre id="requestPreview">点击获取后显示</pre>
    </div>

    <div class="panel">
      <h2>响应结果</h2>
      <pre id="responsePreview">暂无数据</pre>
    </div>
  </div>

  <script>
    const SALT = 'DAvN8GEStOHp0UBka1Zo';
    const OPERATION_GET_APOLLO_CONFIG = 'Xp7KnRqT2wJcVeA9mBsL';

    function uuidv4() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
        const r = (Math.random() * 16) | 0;
        const v = c === 'x' ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    function signWithHmacMd5(data) {
      return CryptoJS.HmacMD5(data, SALT).toString(CryptoJS.enc.Hex);
    }

    function buildProxyHeaders() {
      const timestamp = Date.now() - 4 * 60 * 1000;
      const requestId = uuidv4();
      const operation = OPERATION_GET_APOLLO_CONFIG;
      const sign = signWithHmacMd5(
        `timestamp=${timestamp}&operation=${operation}&requestId=${requestId}`
      );

      return {
        'Content-Type': 'application/json',
        'x-operation': operation,
        'x-timestamp': String(timestamp),
        'x-request-id': requestId,
        'x-signature': sign,
      };
    }

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = 'message ' + type;
    }

    async function fetchApolloConfig() {
      const endpoint = document.getElementById('endpoint').value.trim();
      const btn = document.getElementById('fetchBtn');

      if (!endpoint) {
        showMessage('请填写接口地址', 'error');
        return;
      }

      const headers = buildProxyHeaders();
      const body = {};

      document.getElementById('requestPreview').textContent =
        JSON.stringify({ headers, body }, null, 2);
      document.getElementById('responsePreview').textContent = '请求中...';

      btn.disabled = true;
      btn.textContent = '获取中...';
      showMessage('请求中，请稍候...', 'success');

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers,
          body: JSON.stringify(body),
        });

        const contentType = res.headers.get('content-type') || '';
        let data;

        if (contentType.includes('application/json')) {
          data = await res.json();
        } else {
          data = await res.text();
        }

        document.getElementById('responsePreview').textContent =
          typeof data === 'string' ? data : JSON.stringify(data, null, 2);

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        if (typeof data === 'object' && data.code === 0) {
          const count = data.data ? Object.keys(data.data).length : 0;
          showMessage(`获取成功，共 ${count} 项配置`, 'success');
        } else {
          showMessage('请求完成，请查看响应结果', 'success');
        }
      } catch (err) {
        showMessage('错误:\n' + (err.message || String(err)), 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '获取 Apollo 配置';
      }
    }

    document.getElementById('fetchBtn').addEventListener('click', fetchApolloConfig);
  </script>
</body>
</html>
