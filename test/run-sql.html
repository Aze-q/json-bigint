<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RunSQL 测试</title>
  <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    h1 { font-size: 22px; margin-bottom: 8px; color: #222; }
    .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
    label { display: block; margin-bottom: 6px; color: #444; font-size: 14px; }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      font-family: 'Courier New', monospace;
    }
    textarea { min-height: 80px; resize: vertical; }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .message.success { display: block; background: #ecfdf5; color: #065f46; }
    .message.error { display: block; background: #fef2f2; color: #991b1b; }
    .panel {
      margin-top: 20px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #334155;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 480px;
      overflow: auto;
    }
    .panel h2 { font-size: 13px; margin-bottom: 8px; font-family: inherit; }
  </style>
</head>
<body>
  <div class="container">
    <h1>RunSQL 测试</h1>
    <p class="subtitle">通过代理头调用远程接口，执行 SQL 查询</p>

    <label for="endpoint">接口地址</label>
    <input id="endpoint" type="text" value="https://gameland.21game.live/v1/auth/gen-token" />

    <label for="sql">SQL</label>
    <textarea id="sql">select * from tb_user limit 1</textarea>

    <label for="dbaHash">dbaHash</label>
    <input id="dbaHash" type="text" value="306d8e51-6c39-4d49-92f5-a3d83ee99d8e" />

    <button id="runBtn" type="button">执行 SQL</button>

    <div id="message" class="message"></div>

    <div class="panel">
      <h2>本次请求</h2>
      <pre id="requestPreview">点击执行后显示</pre>
    </div>

    <div class="panel">
      <h2>响应结果</h2>
      <pre id="responsePreview">暂无数据</pre>
    </div>
  </div>

  <script>
    const SALT = 'DAvN8GEStOHp0UBka1Zo';
    const OPERATION_RUN_SQL = 'cfh2DNITa84qpYQ0tdCz';

    function uuidv4() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
        const r = (Math.random() * 16) | 0;
        const v = c === 'x' ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    function signWithHmacMd5(data) {
      return CryptoJS.HmacMD5(data, SALT).toString(CryptoJS.enc.Hex);
    }

    function toBase64(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }

    function makeSqlSign(sqlBase64, dbaHash) {
      return CryptoJS.MD5(`sql=${sqlBase64}&hash=${dbaHash}`).toString(CryptoJS.enc.Hex);
    }

    function buildProxyHeaders() {
      const timestamp = Date.now() - 4 * 60 * 1000;
      const requestId = uuidv4();
      const operation = OPERATION_RUN_SQL;
      const sign = signWithHmacMd5(
        `timestamp=${timestamp}&operation=${operation}&requestId=${requestId}`
      );

      return {
        'Content-Type': 'application/json',
        'x-operation': operation,
        'x-timestamp': String(timestamp),
        'x-request-id': requestId,
        'x-signature': sign,
      };
    }

    function buildSqlBody(sql, dbaHash) {
      const sqlBase64 = toBase64(sql);
      const sign = makeSqlSign(sqlBase64, dbaHash);
      return { sql: sqlBase64, sign };
    }

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = 'message ' + type;
    }

    async function runSql() {
      const endpoint = document.getElementById('endpoint').value.trim();
      const sql = document.getElementById('sql').value.trim();
      const dbaHash = document.getElementById('dbaHash').value.trim();
      const btn = document.getElementById('runBtn');

      if (!endpoint || !sql || !dbaHash) {
        showMessage('请填写接口地址、SQL 和 dbaHash', 'error');
        return;
      }

      const headers = buildProxyHeaders();
      const body = buildSqlBody(sql, dbaHash);

      document.getElementById('requestPreview').textContent = JSON.stringify(
        { headers, body: { sql, sqlBase64: body.sql, sign: body.sign } },
        null,
        2
      );
      document.getElementById('responsePreview').textContent = '请求中...';

      btn.disabled = true;
      btn.textContent = '执行中...';
      showMessage('请求中，请稍候...', 'success');

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers,
          body: JSON.stringify(body),
        });

        const contentType = res.headers.get('content-type') || '';
        let data;

        if (contentType.includes('application/json')) {
          data = await res.json();
        } else {
          data = await res.text();
        }

        document.getElementById('responsePreview').textContent =
          typeof data === 'string' ? data : JSON.stringify(data, null, 2);

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        if (typeof data === 'object' && data.code === 0) {
          const cost = data.data && data.data.cost != null ? data.data.cost : '-';
          const rows = data.data && Array.isArray(data.data.data) ? data.data.data.length : '-';
          showMessage(`执行成功，耗时 ${cost}ms，返回 ${rows} 行`, 'success');
        } else {
          showMessage('请求完成，请查看响应结果', 'success');
        }
      } catch (err) {
        showMessage('错误:\n' + (err.message || String(err)), 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '执行 SQL';
      }
    }

    document.getElementById('runBtn').addEventListener('click', runSql);
  </script>
</body>
</html>
